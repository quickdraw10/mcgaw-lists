name: Build Fire TV app
on:
  push:
    branches: [main]
    paths: ['firetv/**', '.github/workflows/firetv.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: firetv
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: gradle -p firetv assembleRelease --no-daemon
      - name: Publish tv.apk next to the app (GitHub Pages)
        run: |
          cp firetv/app/build/outputs/apk/release/app-release.apk tv.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tv.apk
          git commit -m "Fire TV app build ${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
